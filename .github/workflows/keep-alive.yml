name: Keep Supabase Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          echo "Pinging keep-alive endpoint..."
          if [ -z "$KEEP_ALIVE_URL" ]; then
            echo "Missing KEEP_ALIVE_URL secret"
            exit 1
          fi
          curl --fail --show-error --silent --location "$KEEP_ALIVE_URL"
          echo ""
          echo "Ping completed"
